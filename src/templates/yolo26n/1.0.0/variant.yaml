schema_version: 1
dataset:
  kind: bundled_yolo_detection
  root: data
  image_size: [3, 128, 128]
  classes: [circle, rectangle]
metrics:
  primary: map50_95
  report: [map50_95, map50, precision, recall]
tracker:
  backend: local
components:
  model: yolo26n
  loss: ultralytics
  optimizer: sgd
  dataloader: yolo
  trainer: default
  evaluator: default
  exporter: onnx
train:
  epochs: 10
  batch_size: 4
  learning_rate: 0.01
eval:
  cases:
    default:
      dataset:
        split: val
      selector: {}
      metrics:
        primary: map50_95
        report: [map50_95, map50, precision, recall]
      batch_size: 4
      confidence: 0.001
      iou: 0.7
infer:
  format: onnx
  opset_version: 18
  input_shape: [1, 3, 128, 128]
  output_shape: [1, 300, 6]
